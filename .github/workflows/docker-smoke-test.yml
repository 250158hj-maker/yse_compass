name: Dev environment smoke test

on:
  pull_request:
  push:
    branches: [main]

jobs:
  # ジョブ ID は既存のチェック名を保つためそのまま（実体は「DB は Docker・アプリはホスト」の疎通確認）
  docker-compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Start PostgreSQL
        run: |
          cp .env.example .env
          docker compose up -d db

      - name: Wait for db healthcheck
        run: |
          for i in $(seq 1 30); do
            status="$(docker inspect -f '{{.State.Health.Status}}' yse_compass-db-1 2>/dev/null || echo starting)"
            if [ "$status" = "healthy" ]; then
              exit 0
            fi
            sleep 2
          done
          echo "db did not become healthy in time"
          exit 1

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Start the app on the runner
        run: |
          nohup pnpm dev > dev.log 2>&1 &
          sleep 1

      - name: Check app -> db connection
        run: |
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:3000/api/health/db | grep -q '"status":"ok"'; then
              exit 0
            fi
            sleep 2
          done
          echo "health check did not return ok in time"
          exit 1

      - name: Show logs on failure
        if: failure()
        run: |
          cat dev.log || true
          docker compose logs

      - name: Tear down
        if: always()
        run: docker compose down -v
